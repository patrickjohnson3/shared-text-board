<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>shared text board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="mode-text">
  <main class="app" aria-label="shared text board">
    <header>
      <h1>shared text board</h1>
      <div class="headerMeta">
        <div class="status" id="status" role="status" aria-live="polite">text mode</div>
        <button id="optionsBtn" class="iconButton" type="button" aria-label="Open options" aria-controls="optionsPanel" aria-expanded="false">⚙</button>
      </div>
    </header>

    <section class="modes" aria-label="input mode">
      <button id="textMode" class="active" type="button" aria-label="Text mode" aria-pressed="true">abc</button>
      <button id="numberMode" type="button" aria-label="Number mode" aria-pressed="false">123</button>
      <button id="yesNoMode" type="button" aria-label="Yes or no mode" aria-pressed="false">yes/no</button>
    </section>

    <section class="boardWrap">
      <textarea id="textBox" aria-label="Text to display" placeholder="type here" spellcheck="false" autocomplete="off" autocapitalize="sentences" inputmode="text"></textarea>
      <textarea id="numberBox" aria-label="Number to display" inputmode="numeric" placeholder="123" autocomplete="off"></textarea>
      <div class="yesNo" aria-label="yes no board">
        <div id="yesNoDisplay" class="yesNoDisplay"></div>
        <div class="yesNoButtons">
          <button id="yesBtn" type="button">yes</button>
          <button id="noBtn" type="button">no</button>
        </div>
      </div>
    </section>

    <section class="actions" aria-label="actions">
      <button id="speakBtn" class="actionButton speakAction" type="button">🔊 speak</button>
      <button id="clearBtn" class="actionButton clearAction" type="button">🗑 clear</button>
    </section>
  </main>

  <div id="panelBackdrop" class="panelBackdrop" aria-hidden="true"></div>
  <aside id="optionsPanel" class="optionsPanel" role="dialog" aria-modal="true" aria-labelledby="optionsTitle" aria-hidden="true" inert>
    <div class="panelHeader">
      <h2 id="optionsTitle">options</h2>
      <button id="closeOptionsBtn" class="panelButton closeButton" type="button" aria-label="Close options">close</button>
    </div>

    <label class="field">
      <span>theme</span>
      <select id="themeSelect"></select>
    </label>

    <button id="fullscreenBtn" class="panelButton panelAction" type="button" aria-pressed="false">full screen</button>
  </aside>

  <script src="dom.js"></script>
  <script src="modes.js"></script>
  <script src="panel.js"></script>
  <script src="speech.js"></script>
  <script src="fullscreen.js"></script>
  <script src="app.js"></script>
</body>
</html>
