<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>shared text board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="mode-text">
  <main class="app" aria-label="shared text board">
    <header>
      <h1>shared text board</h1>
      <div class="status" id="status" role="status" aria-live="polite">text mode</div>
    </header>

    <section class="modes" aria-label="input mode">
      <button id="textMode" class="active" type="button" aria-label="Text mode" aria-pressed="true">abc</button>
      <button id="numberMode" type="button" aria-label="Number mode" aria-pressed="false">123</button>
      <button id="yesNoMode" type="button" aria-label="Yes or no mode" aria-pressed="false">yes/no</button>
    </section>

    <section class="boardWrap">
      <textarea id="textBox" placeholder="type here" spellcheck="false" autocomplete="off" autocapitalize="sentences" inputmode="text"></textarea>
      <input id="numberBox" type="text" inputmode="numeric" placeholder="123" autocomplete="off" />
      <div class="yesNo" aria-label="yes no board">
        <div id="yesNoDisplay" class="yesNoDisplay">yes?</div>
        <div class="yesNoButtons">
          <button id="yesBtn" type="button">yes</button>
          <button id="noBtn" type="button">no</button>
        </div>
      </div>
    </section>

    <section class="actions" aria-label="actions">
      <button id="speakBtn" type="button">🔊 speak</button>
      <button id="clearBtn" class="danger" type="button">clear</button>
    </section>

    <div class="hint">one screen. type, show, speak, clear. no accounts. no internet.</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
